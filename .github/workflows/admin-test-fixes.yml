name: Admin - Test Fixes (temporary)

# One-off manual workflow to run backend/scripts/admin/testFixesAdmin.ts.
# Delete this file (and the script) after use -- not part of the regular
# pipeline.

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: npm install
        working-directory: backend
        run: npm install
      - name: Run admin script
        working-directory: backend
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/admin/testFixesAdmin.ts
