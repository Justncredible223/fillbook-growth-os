name: Video Render

# Triggered by a Supabase Edge Function (supabase/functions/trigger-video-render)
# via repository_dispatch when a render_video system_job is inserted.
# Also supports manual dispatch for debugging a specific render.

on:
  repository_dispatch:
    types: [video-render]
  workflow_dispatch:
    inputs:
      videoRenderId:
        description: "video_renders.id"
        required: true
        type: string
      campaignAssetId:
        description: "campaign_assets.id"
        required: true
        type: string

concurrency:
  # One render per video at a time; never cancel a running render.
  group: video-render-${{ github.event.client_payload.videoRenderId || inputs.videoRenderId }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install uv (for edge-tts voiceover)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: npm install
        working-directory: backend
        run: npm install

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Render video
        working-directory: backend
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIDEO_RENDER_ID: ${{ github.event.client_payload.videoRenderId || inputs.videoRenderId }}
          CAMPAIGN_ASSET_ID: ${{ github.event.client_payload.campaignAssetId || inputs.campaignAssetId }}
          FIREBASE_SERVICE_ACCOUNT_JSON_PATH: /tmp/firebase-sa.json
          VIDEO_WORKER_WORK_DIR: /tmp/fillbook-renders
        run: npx tsx scripts/video-worker/render-single.ts

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/firebase-sa.json
